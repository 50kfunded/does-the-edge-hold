name: check the example

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  public-example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: edge-hold example
      - run: edge-hold intraday-example --output runs/intraday-example
      - run: python scripts/check_public.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-report-${{ matrix.python }}
          path: |
            runs/example/*.md
            runs/example/*.csv
            runs/example/*.json
            runs/example/*.png
            runs/intraday-example/study/**/*.md
            runs/intraday-example/study/**/*.csv
            runs/intraday-example/study/**/*.json
            runs/intraday-example/study/**/*.png
