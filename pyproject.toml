[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "does-the-edge-hold"
version = "0.1.0"
description = "A small research audit for futures backtests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "scipy>=1.12", "matplotlib>=3.8", "psutil>=5"]

[project.optional-dependencies]
test = ["pytest>=8"]
databento = ["databento>=0.40"]

[project.scripts]
edge-hold = "does_the_edge_hold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
